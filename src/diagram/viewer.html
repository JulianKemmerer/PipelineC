}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(220px, 22%) 1fr;
  height: 100%; }

  background: var(--pane); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }

  background: var(--pane); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
@media (max-width: 700px) {

<div id="app">

    <label title="label every wire (right-click a wire to show or hide just its label)"><input type="checkbox" id="f-labels"> wire labels</label>

  <textarea id="mm-text" readonly></textarea><button id="mm-close" type="button">close</button></div>
<script type="application/json" id="design">__DIAGRAM_DESIGN_JSON__</script>
<script>
"use strict";
// Any uncaught error is recorded where the render test (#selftest) reads it
addEventListener("error", (ev) => document.body.setAttribute("data-error", ev.message + " (line " + ev.lineno + ")"));
const D = JSON.parse(document.getElementById("design").textContent);
const MARK = "____";                       // LOGIC.SUBMODULE_MARKER
const SVGNS = "http://www.w3.org/2000/svg";
const PALETTE = ["#1f77b4", "#2ca02c", "#9467bd", "#ff7f0e", "#8c564b", "#e377c2",
                 "#17becf", "#bcbd22", "#7f7f7f", "#aec7e8"];
const SEP = "\u0001";                      // between the parts of a hidden node's key
const $ = (id) => document.getElementById(id);
// hidden: key -> "pass" | "drop" of the nodes the viewer hid by hand; labels:
// edge key -> whether its label is shown, where set by hand against the wire
// labels setting; last: the drawn view ({nodes, edges}); size: its extent
const state = { hidden: new Map(), labels: new Map(), view: null, last: null, size: null };

// ---------- types ----------
const NO_TYPE = { c: "", bits: null };
function T(i) { return i == null ? NO_TYPE : D.types[i] || NO_TYPE; }
function bitsOf(i) { return T(i).bits; }
function roleOf(i) { return T(i).role || "plain"; }
const ROLE_TEXT = { fwd: "forward (stream, fwd_t)", fb: "feedback (fb_t)", plain: "plain" };
// "readable_t (8b)", a C name cut to fit a label (the tooltip has it whole)
function typeShort(i) {
  const t = T(i);
  if (!t.c) return "";
  const name = t.name || t.c;
  return (name.length > 48 ? name.slice(0, 47) + "…" : name) + (t.bits != null ? " (" + t.bits + "b)" : "");
}
function typeLong(i) {
  const t = T(i);
  if (!t.c) return "";
  return (t.name ? t.name + " = " + t.c : t.c) + (t.bits != null ? ", " + t.bits + " bits" : "") +
    (t.role ? ", " + ROLE_TEXT[t.role] : "");
}
// The fields a returned struct stands for, an output each, or null: not a
// struct, or one interface's own type (one port)
function splitFields(i) { const t = T(i); return t.fields && !t.interface ? t.fields : null; }
function fieldType(i, name) {
  const f = (T(i).fields || []).find((x) => x[0] === name);
  return f ? f[1] : null;
}
// The role of the data at field path p of type i (DIAGRAM._Types.path_role):
// fb inside a wire_t's Feedback field, else the role of the first interface
// type on the way, or of the deepest type the table describes
function pathRole(i, p) {
  for (const tok of p) {
    const t = T(i);
    if (!t.c) return "plain";
    if (typeof tok === "number") continue;   // an array element: the array's role
    if ((t.feedback || []).includes(tok)) return "fb";
    if (t.interface && !t.feedback) return roleOf(i);
    const f = fieldType(i, tok);
    if (f == null) return roleOf(i);
    i = f;
  }
  return roleOf(i);
}
function pathStr(p) { return p.map((tok) => typeof tok === "number" ? "[" + tok + "]" : "." + tok).join(""); }
function startsWith(a, b) { return b.length <= a.length && b.every((x, i) => x === a[i]); }

// ---------- filters ----------
// What a view can leave out, per kind of node or edge: show it, group it (operators
// only: each connected cluster becomes one logic block), hide it with its edges
// passing through ("pass"), or hide it with its edges ("drop"). A typed kind's mode
// applies to the interface roles its scope names, the rest are shown. The
// defaults draw what a hand-drawn diagram of the data path shows
// (DIAGRAM_DESIGN.md#filters): forward interface data between the blocks,
// without feedback (ready), sideband ports beside forward interfaces, or
// registers and operators apart from the logic blocks they make up.
const KINDS = [
  { id: "in", label: "inputs", tip: "function inputs and top-level Input pins", modes: ["show", "drop"], typed: true, def: "drop", scope: "auto" },
  { id: "out", label: "outputs", tip: "function outputs (one per field of a returned struct) and top-level Output pins", modes: ["show", "drop"], typed: true, def: "drop", scope: "auto" },
  { id: "reg", label: "registers", tip: "a Reg's current and next value; grouping puts the register in the logic block of what it connects to, passing through joins its two values as one edge", modes: ["show", "group", "pass", "drop"], typed: true, def: "group" },
  { id: "wire", label: "global wire reads and writes", tip: "a function's global wire read and write stubs", modes: ["show", "drop"], typed: true, def: "drop", scope: "auto" },
  { id: "fbdata", label: "feedback data", tip: "wires carrying an interface's feedback (an fb_t, a wire_t's Feedback fields: ready), and the logic blocks, ports and pins they leave with nothing else", modes: ["show", "drop"], def: "drop" },
  { id: "fb", label: "Feedback edges", tip: "edges through a Feedback variable, by the type the variable carries", modes: ["show", "drop"], typed: true, def: "drop", scope: "fb" },
  { id: "wiring", label: "wiring", tip: "@wires functions, MAINs, functions and operators with no logic (casts, constant field selects)", modes: ["show", "pass", "drop"], def: "pass" },
  { id: "op", label: "operators", tip: "operators and other built-ins, and the calls operators in the source were implemented by (a soft comparator, say); grouped, a logic block with no drawn output is left out", modes: ["show", "group", "pass", "drop"], def: "group" },
  { id: "const", label: "constants, clock enable", modes: ["show", "drop"], def: "drop" },
  { id: "ghost", label: "other files' MAINs", tip: "in a file's view, the MAINs of other files it connects to", modes: ["show", "drop"], def: "show" },
];
const KIND = new Map(KINDS.map((k) => [k.id, k]));
const SCOPES = [
  ["all", "of every type", ["fwd", "fb", "plain"]],
  ["nonfwd", "except forward (streams, fwd_t)", ["fb", "plain"]],
  ["fwd", "forward only (streams, fwd_t)", ["fwd"]],
  ["fb", "feedback only (fb_t)", ["fb"]],
  ["plain", "plain only (no interface)", ["plain"]],
  ["auto", "feedback, and plain beside forward interfaces", null],
];
const SCOPE = new Map(SCOPES.map(([id, , roles]) => [id, roles]));
const MODE_TEXT = { show: "show", group: "group into logic blocks", pass: "hide, edges pass through", drop: "hide with edges" };
// What a wire's label says
const LABEL_TEXT = [["both", "name: type"], ["name", "name"], ["type", "type"]];
function defaults() {
  const f = { wireLabels: true, labelText: "name" };
  for (const k of KINDS) f[k.id] = { mode: k.def, scope: k.scope || "all" };
  return f;
}
let filt = defaults();
// Per-viewer conveniences in the browser's storage; a page without it uses the defaults
const STORE = "pypelinec-diagram:";
// Key of the saved filters: a new key when the defaults change, so filters
// saved under the old defaults do not keep them
const FILTERS_KEY = "filters.3";
let storageOff = false;   // the self-test leaves the browser's storage alone
function loadStored(key) {
  try { const v = localStorage.getItem(STORE + key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function store(key, value) {
  if (storageOff) return;
  try { localStorage.setItem(STORE + key, JSON.stringify(value)); } catch (e) { /* storage blocked */ }
}
function loadSettings() {
  const f = defaults(), saved = loadStored(FILTERS_KEY);
  if (saved && typeof saved === "object") {
    for (const k of KINDS) {
      const s = saved[k.id];
      if (!s) continue;
      if (k.modes.includes(s.mode)) f[k.id].mode = s.mode;
      if (k.typed && SCOPE.has(s.scope)) f[k.id].scope = s.scope;
    }
    if (typeof saved.wireLabels === "boolean") f.wireLabels = saved.wireLabels;
    if (LABEL_TEXT.some(([id]) => id === saved.labelText)) f.labelText = saved.labelText;
  }
  filt = f;
  const hid = loadStored("hidden:" + D.build.top);
  state.hidden = new Map(Array.isArray(hid) ? hid.filter((h) => Array.isArray(h) && (h[1] === "pass" || h[1] === "drop")) : []);
  const lab = loadStored("labels:" + D.build.top);
  state.labels = new Map(Array.isArray(lab) ? lab.filter((h) => Array.isArray(h) && typeof h[0] === "string" && typeof h[1] === "boolean") : []);
}
function saveSettings() {
  store(FILTERS_KEY, filt);
  store("hidden:" + D.build.top, [...state.hidden]);
  store("labels:" + D.build.top, [...state.labels]);
}
// Whether kind k's mode applies to something with this interface role, in a
// view whose inputs and outputs include forward interface ports (iface) or
// not: "auto" takes feedback ports, and plain ones beside forward interfaces
function applies(k, role, iface) {
  if (!KIND.get(k).typed) return true;
  const scope = filt[k].scope;
  if (scope === "auto") return role === "fb" || (role === "plain" && !!iface);
  return SCOPE.get(scope).includes(role || "plain");
}
// Whether ports [{dir: "in" | "out", role}] include a forward interface each way
function hasIface(ports) {
  const fwd = (dir) => ports.some((p) => p.dir === dir && p.role === "fwd");
  return fwd("in") && fwd("out");
}

// ---------- names and lookups ----------
const clockIds = Object.keys(D.clocks).sort();
function clockColor(cid) {
  const i = clockIds.indexOf(cid);
  return i < 0 ? "#999" : PALETTE[i % PALETTE.length];
}
function base(path) { return path ? path.split("/").pop() : "?"; }
function loc(file, line) { return file ? base(file) + (line ? ":" + line : "") : ""; }
function func(name) { return D.funcs[name] || { kind: "op" }; }
function mainLabel(m) {
  const e = D.mains[m], f = D.funcs[m];
  if (e && e.name) return e.name;
  return (f && f.def) || m;
}
function mainGroup(m) {
  const e = D.mains[m];
  return e && e.group ? "group:" + e.group : m;
}
function mainOf(inst) { return inst.startsWith("pin:") ? inst : inst.split(MARK)[0]; }
function fmtNs(x) { return x == null ? "" : (Math.round(x * 100) / 100) + " ns"; }
function hasGraph(fname) { const f = D.funcs[fname]; return !!(f && f.graph); }
const topFile = Object.keys(D.files).find((p) => D.files[p].top) || null;
// A function's graph as {nodes: {id: node}, edges: [{s, sp, d, dp, t, names, fb}]},
// unpacked once from the page's compact form (edges name nodes by index)
const graphs = new Map();
function graphOf(fname) {
  if (graphs.has(fname)) return graphs.get(fname);
  const f = D.funcs[fname];
  let g = null;
  if (f && f.graph) {
    const list = f.graph.nodes, nodes = {};
    for (const n of list) nodes[n.id] = n;
    const edges = f.graph.edges.map(([s, sp, d, dp, t, names, fb]) =>
      ({ s: list[s].id, sp, d: list[d].id, dp, t, names, fb: !!fb }));
    g = { nodes, edges };
  }
  graphs.set(fname, g);
  return g;
}
// An operator's name from its function (BIN_OP_PLUS_uint8_t_uint8_t -> BIN_OP_PLUS)
// and the symbol a logic block shows for it
function opName(callee) {
  const out = [];
  for (const t of callee.split("_")) { if (/^[A-Z0-9]+$/.test(t)) out.push(t); else break; }
  return out.length ? out.join("_") : callee;
}
const OP_SYMBOLS = { BIN_OP_PLUS: "+", BIN_OP_MINUS: "−", BIN_OP_MULT: "×", BIN_OP_INFERRED_MULT: "×",
  BIN_OP_DIV: "÷", BIN_OP_MOD: "%", BIN_OP_EQ: "==", BIN_OP_NEQ: "!=", BIN_OP_LT: "<", BIN_OP_LTE: "<=",
  BIN_OP_GT: ">", BIN_OP_GTE: ">=", BIN_OP_AND: "&", BIN_OP_OR: "|", BIN_OP_XOR: "^", BIN_OP_SL: "<<",
  BIN_OP_SR: ">>", UNARY_OP_NOT: "~", UNARY_OP_NEGATE: "−x", MUX: "mux", VAR_REF_RD: "[i]",
  VAR_REF_ASSIGN: "[i]=", SIM_ASSERT: "assert" };
// name: an operator function's (BIN_OP_PLUS) or a dispatched op's (PLUS)
function opSymbol(name) {
  return OP_SYMBOLS[name] || OP_SYMBOLS["BIN_OP_" + name] || OP_SYMBOLS["UNARY_OP_" + name] || name.toLowerCase();
}

// Resolve an instance path (MAIN____local____local) to [[inst, func, local], ...]
function resolve(inst) {
  const toks = inst.split(MARK);
  const main = toks[0];
  if (!D.funcs[main]) return null;
  const chain = [[main, main, null]];
  let cur = main, path = main, i = 1;
  while (i < toks.length) {
    const g = graphOf(cur);
    if (!g) return null;
    let j = i, local = null;
    for (; j < toks.length; j++) {     // a local name may itself hold the marker
      const cand = toks.slice(i, j + 1).join(MARK);
      if (g.nodes["s:" + cand]) { local = cand; break; }
    }
    if (local == null) return null;
    cur = g.nodes["s:" + local].callee;
    path += MARK + local;
    chain.push([path, cur, local]);
    i = j + 1;
  }
  return chain;
}
function instLatency(inst) {
  if (!inst.includes(MARK) && D.mains[inst]) return D.mains[inst].latency;
  return D.inst_latency[inst] || 0;
}

// ---------- files ----------
const fileOrder = [];      // [path, parent or null] in tree order
(function orderFiles() {
  const seen = new Set();
  const queue = topFile ? [[topFile, null]] : [];
  while (queue.length) {
    const [p, parent] = queue.shift();
    if (seen.has(p) || !D.files[p]) continue;
    seen.add(p);
    fileOrder.push([p, parent]);
    for (const q of D.files[p].imports) queue.push([q, p]);
  }
  for (const p of Object.keys(D.files).sort()) if (!seen.has(p)) fileOrder.push([p, null]);
})();
// The view a file's link shows: the top file is the whole design
function fileRoute(p) { return D.files[p] && D.files[p].top ? { design: 1 } : { file: p }; }

// ---------- tooltip ----------
const tip = $("tip");
function showTip(ev, text) {
  tip.textContent = text;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 4) x = Math.max(4, ev.clientX - w - 14);
  if (y + h > innerHeight - 4) y = Math.max(4, ev.clientY - h - 14);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function attachTip(el, textFn) {
  el.addEventListener("mousemove", (ev) => showTip(ev, textFn()));
  el.addEventListener("mouseleave", hideTip);
}
function funcTip(fname, extra) {
  const f = func(fname), lines = [];
  if (extra) lines.push(...extra);
  lines.push("function: " + fname);
  if (f.def && f.def !== fname) lines.push("def: " + f.def);

// One logic block for a cluster of operators and registers: a cloud when it is

function groupNode(gid, grp, fname, g, f, inst, hl) {
  const counts = new Map(), regs = [];

  for (const id of grp.members) {
    const m = g.nodes[id];
    if (m.kind !== "sub") { if (!regs.includes(m.name)) regs.push(m.name); continue; }
    n++;
    const k = m.op ? m.op[0] : func(m.callee).assert ? "SIM_ASSERT" : opName(m.callee);
    counts.set(k, (counts.get(k) || 0) + 1);
    lat = Math.max(lat, instLatency(inst + MARK + id.slice(2)));
  }
  regs.sort();
  const ops = [...counts].sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));

  if (span) tags.push(fmtNs(span[1] - span[0]));

  const shown = ops.filter(([k]) => k !== "SIM_ASSERT").concat(ops.filter(([k]) => k === "SIM_ASSERT"));
  const head = shown.length ? shown.slice(0, 4).map(([k]) => opSymbol(k)).join(" ") + (shown.length > 4 ? " …" : "")

  const tipText = () => {
    const lines = ["logic: " + n + " operator" + (n === 1 ? "" : "s") +
      (regs.length ? " and " + regs.length + " register" + (regs.length === 1 ? "" : "s") : "") +
      " (filters › operators, registers: show draws each)"];
    for (const [k, c] of ops.slice(0, 16)) lines.push("  " + c + "× " + opSymbol(k) + (opSymbol(k) !== k.toLowerCase() ? "  " + k : ""));
    if (ops.length > 16) lines.push("  … " + (ops.length - 16) + " more kinds");
    if (regs.length) lines.push("registers: " + regs.slice(0, 12).join(", ") + (regs.length > 12 ? " …" : ""));
    if (grp.names.size) {
      const names = [...grp.names].sort();
      lines.push("variables inside: " + names.slice(0, 12).join(", ") + (names.length > 12 ? " …" : ""));
    }
    lines.push(lat ? "an operator in it has latency " + lat : comb ? "combinational: no registers inside"
      : regs.length ? "holds registers" + (fnLat ? "; this function instance has latency " + fnLat : "")
      : "this function instance has latency " + fnLat + ": registers that line up its paths may sit among these operators");
    if (span) lines.push("delay through it: " + fmtNs(span[1] - span[0]) + " (" + fmtNs(span[0]) + " to " + fmtNs(span[1]) + ")");

  return { id: gid, cls: (comb ? "cloud" : "logic") + (grp.members.includes(hl) ? " hl" : ""), members: grp.members,
    lines: [head, tags.join("  ")],
    tip: tipText,
    hide: { label: "logic (" + n + (n === 1 ? " operator" : " operators") + (regs.length ? ", " + regs.length + (regs.length === 1 ? " register)" : " registers)") : ")"),
      keys: grp.members.map((id) => fname + SEP + id), modes: ["pass", "drop"] } };
}
// Hardware scale (as the old pipeline_map.png): a block is as wide as its
// delay and as tall as its mean in/out bus width. With the compiler's
// zero-added-clocks offsets (f.offsets) x is its start time; otherwise the
// layered x positions stay.
function hardwareScale(nodes, edges, g, f) {
  const blocks = nodes.filter((n) => n.members || (g.nodes[n.id] && g.nodes[n.id].kind === "sub"));
  const offsets = f.offsets || null;
  const delayOf = (n) => {
    if (!n.members) return func(g.nodes[n.id].callee).delay_ns;
    const s = groupSpan(n.members, f);
    if (s) return s[1] - s[0];
    const most = Math.max(0, ...n.members.map((id) => func(g.nodes[id].callee).delay_ns || 0));
    return most || null;
  };
  const startOf = (n) => {
    if (!offsets) return null;
    if (n.members) { const s = groupSpan(n.members, f); return s ? s[0] : null; }
    const o = offsets[n.id.slice(2)];
    return o ? o[0] : null;
  };
  const edgeBits = new Map();
  for (const e of edges) for (const id of [e.s, e.d]) edgeBits.set(id, Math.max(edgeBits.get(id) || 0, e.bits || 0));
  const busBits = (n) => {
    const cf = n.members ? null : func(g.nodes[n.id].callee), sum = (l) => (l || []).reduce((s, [, t]) => s + (bitsOf(t) || 0), 0);
    return cf && cf.inputs ? (sum(cf.inputs) + sum(cf.outputs)) / 2 : edgeBits.get(n.id) || 1;
  };
  const maxNs = offsets ? Math.max(0, ...Object.values(offsets).map((o) => o[1]))
                        : Math.max(0, ...blocks.map((n) => delayOf(n) || 0));
  if (!(maxNs > 0)) return null;
  const K = 1200 / maxNs;   // px per ns
  for (const n of blocks) {
    n.h = Math.min(200, 16 + 3 * Math.sqrt(busBits(n)));
    const d = delayOf(n);
    if (d != null) n.w = Math.max(isCloud(n) ? 30 : 6, d * K);
    const fit = Math.max(1, Math.floor((n.w - 10) / 6.4));   // name only, cut to the block
    n.lines = [n.lines[0].length > fit ? n.lines[0].slice(0, Math.max(0, fit - 1)) + "…" : n.lines[0]];
  }
  let x0 = 0;   // where t = 0 lands once place() has shifted everything right
  return {
    note: offsets ? "  (x: start time, width: delay, height: bus bits)" : "  (width: delay, height: bus bits; no start times)",
    place(nodes, size) {
      if (!offsets) return size;
      let right = 0;
      for (const n of blocks) {
        const s = startOf(n);
        if (s != null) { n.x = s * K; right = Math.max(right, n.x + n.w); }
      }
      for (const n of nodes) {
        if (n.rank === "first") n.x = -n.w - 40;
        if (n.rank === "last") n.x = Math.max(right, maxNs * K) + 40;
      }
      const left = Math.min(...nodes.map((n) => n.x)), xe = nodes.map((n) => n.x + n.w);
      for (const n of nodes) n.x -= left;
      x0 = -left;
      return { width: Math.max(...xe) - left, height: size.height };
    },
    axis(parent) {
      if (!offsets) return;
      const H = Math.max(...nodes.map((n) => n.y + n.h)) + 10;
      const step = Math.pow(10, Math.floor(Math.log10(maxNs / 2))) * (maxNs / Math.pow(10, Math.floor(Math.log10(maxNs))) > 5 ? 2 : 1);
      for (let t = 0; t <= maxNs + 1e-9; t += step) {
        svgEl("line", { x1: x0 + t * K, x2: x0 + t * K, y1: -6, y2: H, class: "axis" }, parent.firstChild);
        const tx = svgEl("text", { x: x0 + t * K + 2, y: H + 12, class: "tick" }, parent);
        tx.textContent = (Math.round(t * 100) / 100) + " ns";
      }
    },
  };
}

function go(r) {

// ---------- search ----------
let instIndex = null;   // [display path, instance, parent instance, node id] of non-operator instances
function buildIndex() {
  instIndex = [];
  const walk = (inst, fname, label, depth) => {
    const g = graphOf(fname);
    if (!g || depth > 64 || instIndex.length > 50000) return;
    for (const id of Object.keys(g.nodes).sort()) {
      const n = g.nodes[id];
      if (n.kind !== "sub" || func(n.callee).kind === "op") continue;
      const child = inst + MARK + id.slice(2), text = label + "/" + n.name;
      instIndex.push([text, child, inst, id]);
      walk(child, n.callee, text, depth + 1);
    }
  };
  for (const m of Object.keys(D.mains).sort()) { instIndex.push([mainLabel(m), m, null, null]); walk(m, m, mainLabel(m), 0); }
}
function search(text) {
  const box = $("results");
  box.replaceChildren();
  text = text.trim().toLowerCase();
  if (!text) { box.style.display = "none"; return; }
  if (!instIndex) buildIndex();
  const hits = instIndex.filter((r) => r[0].toLowerCase().includes(text)).slice(0, 200);
  for (const [label, child, parent, id] of hits) {
    const d = el("div", null, label);
    d.addEventListener("click", () => {
      box.style.display = "none";
      go(parent == null || hasGraph(resolve(child).pop()[1]) ? { inst: child } : { inst: parent, hl: id });
    });
    box.appendChild(d);
  }
  if (!hits.length) box.appendChild(el("div", "dim", "no instance matches"));
  const r = $("search").getBoundingClientRect();

// ---------- copy as Mermaid ----------
// The drawn view as Mermaid flowchart text: its blocks, and its edges with the
// labels shown. Mermaid's layout (dagre) puts a block next to what it connects
// to, so the inputs (and registers, global wire reads) go in one subgraph and
// the outputs in another: dagre keeps each subgraph's blocks in one column,
// left of everything they feed and right of everything feeding them. Blocks
// are declared in the view's order, left to right, and edges sorted by their
// source's place, then their destination's: dagre breaks a loop at the edge
// its depth-first walk in that order meets last, so an edge the view draws
// backwards (a Feedback into an earlier block) stays the one that is reversed.
function mermaidText() {
  const { nodes: drawnNodes, edges } = state.last || { nodes: [], edges: [] };
  const esc = (t) => String(t).replace(/"/g, "#quot;").replace(/</g, "#lt;").replace(/>/g, "#gt;");
  const q = (lines) => '"' + lines.map(esc).join("<br>") + '"';
  const side = (n) => n.rank === "first" ? 0 : n.rank === "last" ? 2 : 1;
  const nodes = drawnNodes.slice().sort((a, b) =>
    side(a) - side(b) || (a.x + a.w / 2) - (b.x + b.w / 2) || a.y - b.y);
  const ids = new Map(nodes.map((n, i) => [n.id, "n" + i]));
  const place = new Map(nodes.map((n, i) => [n.id, i]));
  const shape = (n) => ids.get(n.id) + (isCloud(n) ? "((" + q(n.mermaid || n.lines) + "))" : "[" + q(n.mermaid || n.lines) + "]");
  const out = ["flowchart LR"];
  for (const n of nodes) if (n.rank !== "first" && n.rank !== "last") out.push("    " + shape(n));
  for (const [rank, sub] of [["first", "inputs"], ["last", "outputs"]]) {
    const members = nodes.filter((n) => n.rank === rank);
    if (!members.length) continue;
    out.push("    subgraph " + sub + '[" "]');
    for (const n of members) out.push("        " + shape(n));
    out.push("    end", "    style " + sub + " fill:none,stroke:none");
  }
  const cross = [];
  let i = 0;
  const shown = edges.filter((e) => ids.has(e.s) && ids.has(e.d));
  shown.sort((a, b) => place.get(a.s) - place.get(b.s) || place.get(a.d) - place.get(b.d));
  for (const e of shown) {
    const arrow = e.fb ? "-.->" : "-->";
    out.push("    " + ids.get(e.s) + " " + arrow + (e.lines.length ? "|" + q(e.lines) + "|" : "") + " " + ids.get(e.d));
    if (e.cross) cross.push(i);
    i++;
  }
  if (cross.length) out.push("    linkStyle " + cross.join(",") + " stroke:#d62728");
  // dagre ranks an output right after what feeds it, which can be before
  // blocks of later layers (a view with loops): invisible links from the
  // page's last middle layer put the outputs after it
  const middle = nodes.filter((n) => n.rank !== "first" && n.rank !== "last");
  const center = (n) => Math.round(n.x + n.w / 2);
  const lastX = Math.max(...middle.map(center));
  const last = nodes.filter((n) => n.rank === "last");
  if (last.length) for (const m of middle) if (center(m) === lastX) out.push("    " + ids.get(m.id) + " ~~~ " + ids.get(last[0].id));
  return out.join("\n") + "\n";
}
$("mermaid").addEventListener("click", () => {
  const text = mermaidText();
  const fallback = () => { $("mm-text").value = text; $("mm").style.display = "flex"; $("mm-text").select(); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => { $("info").textContent = "copied Mermaid text"; }, fallback);
  } else fallback();
});
$("mm-close").addEventListener("click", () => { $("mm").style.display = "none"; });

// ---------- self-test ----------
// Draws every view with the default filters, everything shown and everything
// hidden, checking what each must and must not draw, then marks <body>
// data-ready="<views drawn>" (data-error on any failure), which the render test
// reads, with what each default view drew in <script id="drawn">: view ("design"
// or a function) -> {blocks: first lines, wires: wire names, edges: [source's
// first line, destination's first line], labels: each edge's label lines}
function withFilters(change, fn) {
  const saved = JSON.stringify(filt);
  change(filt);
  try { return fn(); } finally { filt = JSON.parse(saved); }
}
const ALL_SHOWN = (f) => { for (const k of KINDS) f[k.id].mode = "show"; };
const ALL_HIDDEN = (f) => {
  for (const k of KINDS) { f[k.id].mode = k.modes.includes("pass") ? "pass" : "drop"; f[k.id].scope = "all"; }
};
// The Mermaid text of the drawn view declares its blocks in the view's order,
// left to right, and lists the edges by their sources' places (see mermaidText)
function checkMermaidOrder(where, check) {
  const mm = mermaidText();
  const firstLine = (n) => String((n.mermaid || n.lines)[0]).replace(/"/g, "#quot;").replace(/</g, "#lt;").replace(/>/g, "#gt;");
  const pool = new Map();
  for (const n of state.last.nodes) {
    if (n.rank === "first" || n.rank === "last") continue;
    if (!pool.has(firstLine(n))) pool.set(firstLine(n), []);
    pool.get(firstLine(n)).push(n.x + n.w / 2);
  }
  for (const xs of pool.values()) xs.sort((a, b) => a - b);
  const declaredX = [...mm.matchAll(/^    n\d+[[(]+"([^"]*?)(?:<br>|")/gm)].map((m) => (pool.get(m[1]) || [NaN]).shift());
  check(declaredX.every((x, k) => !k || x >= declaredX[k - 1]), "Mermaid blocks not declared left to right in " + where);
  const sources = [...mm.matchAll(/^    n(\d+) -\.?->/gm)].map((m) => +m[1]);
  check(sources.every((s, k) => !k || s >= sources[k - 1]), "Mermaid edges not listed by their sources' places in " + where);
}
function selftest() {
  let views = 0;
  const drawn = {};
  const record = (key, v) => {
    const first = new Map(v.nodes.map((n) => [n.id, n.lines[0]]));
    drawn[key] = { blocks: v.nodes.map((n) => n.lines[0]), wires: [].concat(...v.edges.map((e) => e.wires.map((w) => w.name))),
      edges: v.edges.map((e) => [first.get(e.s), first.get(e.d)]), labels: v.edges.map((e) => e.lines) };
  };
  const check = (ok, what) => { if (!ok) throw new Error("self-test: " + what); };
  const drawnIds = (v) => new Set(v.nodes.map((n) => n.id));
  // What a graph node is, from the data alone (not from the filters' own nodeKindOf)
  const isOp = (gn) => gn.kind === "sub" && (func(gn.callee).kind === "op" || !!gn.op) && !func(gn.callee).wiring;
  const isWiring = (gn) => gn.kind === "sub" && !!func(gn.callee).wiring;
  const isBlock = (gn) => gn.kind === "sub" && !isOp(gn) && !isWiring(gn);
  try {
    storageOff = true;
    filt = defaults();
    state.hidden = new Map();
    const labelsDrawn = () => vp.querySelectorAll("text.el").length;
    // A wide, flat layered drawing spreads its rows out towards the pane's shape
    const three = () => ["a", "b", "c", "d"].map((id) => ({ id, w: 100, h: 40 }));
    const fan = [{ s: "a", d: "b" }, { s: "a", d: "c" }, { s: "a", d: "d" }];
    const flat = layout(three(), fan, 70, 0), tall = layout(three(), fan, 70, 1);
    check(flat.height < tall.height && tall.height <= tall.width, "rows do not spread to the pane's shape");
    // An edge that skips a layer runs through a place of its own, clear of the
    // block in that layer; a Feedback edge closing no cycle is laid out forward
    const chain = three().slice(0, 3), skip = [{ s: "a", d: "b" }, { s: "b", d: "c" }, { s: "a", d: "c" }];
    layout(chain, skip, 70, 0);
    const via = skip[2].points, mid = chain[1].y + chain[1].h / 2;
    check(via && via.length === 1 && Math.abs(via[0][2] - mid) >= chain[1].h / 2 + GAP_Y_MIN, "an edge that skips a layer runs over a block");
    // A bundle's array elements are listed as index runs
    const run = compactWires(["k[1]", "k[0]", "k[3]", "x.y"].map((name) => ({ name, t: null }))).map((w) => w.name);
    check(run.join(" ") === "k[0..1,3] x.y", "array elements not listed as index runs: " + run.join(" "));
    // ... and a name label puts the fields one variable carries on one line
    const named = nameLines(["r.valid", "r.data", "x", "a", "a.b"].map((name) => ({ name, t: null })));
    check(named.join(" | ") === "r: valid, data | x | a | a.b", "fields of one variable not on one label line: " + named.join(" | "));
    const loopless = three().slice(0, 2);
    layout(loopless, [{ s: "a", d: "b", fb: true }], 70, 0);
    check(loopless[1].x > loopless[0].x, "a Feedback edge closing no cycle is laid out backwards");
    const home = designView(null); views++;
    record("design", home);
    // By default every edge is labeled, by its wires' names
    check(home.edges.every((e) => e.lines.length) && labelsDrawn() === home.edges.length, "an edge drawn without its label");
    for (const e of home.edges) check(!e.feedback, "the design view draws feedback data " + e.s + " → " + e.d);
    // Pins packed into one global wire are drawn as one port, and none of them on its own
    const homeIds = drawnIds(home);
    for (const n of home.nodes) {
      if (!n.id.startsWith("pins:")) continue;
      check(n.hide.keys.length > 1, "a pin group of one pin " + n.id);
      for (const k of n.hide.keys) check(!homeIds.has("pin:" + k.split(SEP)[1]), "a grouped pin drawn on its own " + k);
    }
    check($("banner").style.display === "none", "the whole design has a file banner");
    for (const n of home.nodes) {
      if (n.id.startsWith("pin:") || n.id.startsWith("pins:")) continue;
      const ms = Object.keys(D.mains).filter((m) => mainGroup(m) === n.id);
      check(!ms.every((m) => D.mains[m].wiring), "wiring MAIN drawn by default: " + n.id);
    }
    if (topFile) check(fileRoute(topFile).design, "the top file does not open the whole design");
    for (const p of Object.keys(D.files)) {
      designView(p); views++;
      check($("banner").style.display === "block", "a file view has no banner: " + p);
    }
    const done = new Set();
    const walk = (inst, fname) => {
      if (done.has(fname)) return;
      done.add(fname);
      const g = graphOf(fname);
      const v = functionView(inst); views++;
      record(fname, v);
      checkMermaidOrder(fname, check);
      const ids = drawnIds(v);
      for (const e of v.edges) check(ids.has(e.s) && ids.has(e.d), "edge to an undrawn node in " + fname);
      // A returned struct is drawn as its fields; ports are neither feedback
      // nor, beside forward interfaces each way, plain
      const split = splitOutputs(g), fields = new Map();
      for (const fl of split.values()) for (const x of fl) fields.set(x.id, x);
      const sideband = viewIface(g, split);
      for (const n of v.nodes) {
        const gn = g.nodes[n.id];
        const port = fields.get(n.id) || (gn && /^(in|out|wire_read|wire_write)$/.test(gn.kind) ? gn : null);
        if (port) {
          const role = fields.has(n.id) ? roleOf(port.t) : nodeRole(port);
          check(role !== "fb", "a default view draws a feedback port " + n.id + " in " + fname);
          check(!sideband || role !== "plain", "a default view draws a plain port beside forward interfaces " + n.id + " in " + fname);
        }
        if (!gn) continue;
        check(!split.has(n.id), "a returned struct drawn as one output " + n.id + " in " + fname);
        check(!isOp(gn), "a default view draws an operator " + n.id + " in " + fname);
        check(!isWiring(gn), "a default view draws a wiring call site " + n.id + " in " + fname);
        check(gn.kind !== "reg" && gn.kind !== "reg_next", "a default view draws a register " + n.id + " in " + fname);
        check(gn.kind !== "const" && gn.kind !== "ce", "a default view draws a constant " + n.id + " in " + fname);
      }
      for (const e of v.edges) check(!e.feedbackRoles.includes("fb"), "a default view draws an fb_t Feedback edge in " + fname);
      for (const e of v.edges) for (const w of e.wires) check(!w.fb, "a default view draws feedback data " + w.name + " in " + fname);
      // Every logic block drawn has a drawn output
      for (const n of v.nodes) if (n.members) check(v.edges.some((e) => e.s === n.id), "a logic block with no output drawn in " + fname);
      check(v.edges.every((e) => e.lines.length) && labelsDrawn() === v.edges.length, "an edge drawn without its label in " + fname);
      // Operators and registers joined by a surviving edge, directly or through
      // wiring, share one logic block, as do a register's two values
      const gid = new Map();
      for (const [id, grp] of v.groups) for (const m of grp.members) gid.set(m, id);
      const viaWiring = new Map();   // wiring node -> the logic blocks it touches
      for (const e of g.edges) {
        if (e.fb && roleOf(e.t) === "fb") continue;
        if (gid.has(e.s) && gid.has(e.d)) check(gid.get(e.s) === gid.get(e.d), "joined operators in two logic blocks in " + fname);
        for (const [w, m] of [[e.s, e.d], [e.d, e.s]]) {
          if (!gid.has(m) || !g.nodes[w] || !isWiring(g.nodes[w])) continue;
          if (!viaWiring.has(w)) viaWiring.set(w, new Set());
          viaWiring.get(w).add(gid.get(m));
        }
      }
      for (const [w, blocks] of viaWiring) check(blocks.size === 1, "operators joined through wiring " + w + " in two logic blocks in " + fname);
      for (const id of gid.keys()) {
        if (id.startsWith("rq:") && gid.has("rd:" + id.slice(3))) check(gid.get(id) === gid.get("rd:" + id.slice(3)), "a register's values in two logic blocks in " + fname);
      }
      withFilters((f) => { ALL_SHOWN(f); f.wireLabels = true; }, () => {
        const w = functionView(inst); views++;
        const shown = drawnIds(w), split = splitOutputs(g);
        for (const id of Object.keys(g.nodes)) {
          for (const x of split.has(id) ? split.get(id).map((y) => y.id) : [id])
            check(shown.has(x), "not every node drawn with everything shown: " + x + " in " + fname);
        }
        // Every wire has a name (a variable, or else the port it feeds) and
        // every edge's label is drawn
        for (const e of w.edges) for (const x of e.wires) check(x.name, "an unnamed wire " + e.s + " → " + e.d + " in " + fname);
        check(labelsDrawn() === w.edges.filter((e) => e.lines.length).length, "not every wire label drawn in " + fname);
      });
      withFilters(ALL_HIDDEN, () => {
        const w = functionView(inst); views++;
        for (const n of w.nodes) {
          const gn = g.nodes[n.id];
          check(gn && isBlock(gn), "drawn with everything hidden: " + n.id + " in " + fname);
        }
        for (const e of w.edges) check(!e.feedbackRoles.length, "Feedback edge drawn with everything hidden in " + fname);
      });
      if (func(fname).offsets) { $("f-scale").checked = true; functionView(inst); $("f-scale").checked = false; views++; }
      for (const id of Object.keys(g.nodes)) {
        const n = g.nodes[id];
        if (n.kind === "sub" && func(n.callee).kind !== "op" && hasGraph(n.callee)) walk(inst + MARK + id.slice(2), n.callee);
      }
    };
    for (const m of Object.keys(D.mains).sort()) if (hasGraph(m)) walk(m, m);
    // Hiding one node by hand as its menu does (render() draws the design view
    // at #selftest), with its edges passing through and with them
    const rendered = () => check(!$("info").textContent, "render: " + $("info").textContent);
    const first = home.nodes.find((n) => n.hide && n.hide.modes.includes("pass"));
    if (first) {
      openMenu({ clientX: 10, clientY: 10 }, first.hide);
      for (const m of ["pass", "drop"]) {
        setHidden(first.hide.keys, m); views++; rendered();
        check(!drawnIds(state.last).has(first.id), "a MAIN hidden by hand is drawn (" + m + ")");
        showHiddenList();
        setHidden(first.hide.keys, null); views++; rendered();
        check(drawnIds(state.last).has(first.id), "a MAIN shown again is not drawn (" + m + ")");
      }
    }
    // A filter changed as the panel does
    buildFilters();
    filt.ghost.mode = "drop";
    filtersChanged(); views++; rendered();
    filt = defaults();
    filtersChanged(); views++; rendered();
    closePanels();
    const edges = state.last.edges;
    if (edges.length) {
      // One wire's label hidden from its menu, then back to the setting
      const e0 = edges[0], labeled = () => mermaidText().split("\n").filter((l) => /-\.?->\|/.test(l)).length;
      edgeMenu({ clientX: 10, clientY: 10 }, e0);
      setLabel(e0.key, false); views++; rendered();
      check(labelsDrawn() === edges.length - 1, "a label hidden by hand is drawn, or another one is not");
      check(labeled() === edges.length - 1, "the Mermaid text labels the edge whose label is hidden");
      setLabel(e0.key, true); views++; rendered();
      check(!state.labels.size && labelsDrawn() === edges.length, "a label shown again is still set by hand or not drawn");
      // Hovering a wire lights it up, hovering a block all its edges
      const hot = () => vp.querySelector(".hotl").childNodes.length;
      const hit = vp.querySelector("path.hit");
      hit.dispatchEvent(new MouseEvent("mouseenter"));
      check(hot() === 1, "a hovered wire is not lit");
      hit.dispatchEvent(new MouseEvent("mouseleave"));
      check(!hot(), "a wire stays lit");
      const n0 = state.last.nodes[0];
      vp.querySelector("g.n").dispatchEvent(new MouseEvent("mouseenter"));
      check(hot() === state.last.edges.filter((e) => e.s === n0.id || e.d === n0.id).length, "a hovered block's edges are not lit");
    }
    // The Mermaid text keeps the inputs together on the left, the outputs on the right
    const mm = mermaidText();
    check(mm.startsWith("flowchart LR"), "mermaid text");
    for (const [rank, sub] of [["first", "inputs"], ["last", "outputs"]]) {
      check(mm.includes("subgraph " + sub + "[") === state.last.nodes.some((n) => n.rank === rank), "Mermaid " + sub + " subgraph");
    }
    // ... and its outputs after its last blocks
    const hasMiddle = state.last.nodes.some((n) => n.rank !== "first" && n.rank !== "last");
    check(mm.includes(" ~~~ ") === (hasMiddle && state.last.nodes.some((n) => n.rank === "last")), "Mermaid outputs not after the last blocks");
    buildIndex(); search("a"); search("");
    const out = document.createElement("script");
    out.type = "application/json";
    out.id = "drawn";
    out.textContent = JSON.stringify(drawn).replace(/</g, "\\u003c");
    document.body.appendChild(out);
    document.body.setAttribute("data-ready", String(views));
  } catch (err) {
    document.body.setAttribute("data-error", String(err && err.stack || err));
  }
}

  for (const cid of clockIds) {

$("title").textContent = base(D.build.top) + " — design diagram";
document.title = base(D.build.top) + " diagram";
if (location.hash !== "#selftest") loadSettings();
$("f-labels").checked = filt.wireLabels;
legend();
buildFilters();
hiddenButton();
