<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design diagram</title>
<!-- Written by PypelineC (src/DIAGRAM.py) from src/diagram/viewer.html; see
     docs/DIAGRAM_DESIGN.md. Self-contained: no network access. -->
<style>
:root {
  --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #c8c8cc;
  --pane: #f5f5f7; --node: #ffffff; --node-border: #8a8a90; --accent: #2563eb;
  --edge: #7a7a80; --cross: #d62728; --ghost: #b0b0b5; --hl: #fde68a;
  --cloud: #eaf0f8; --logic: #f4efe4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1e; --fg: #e6e6e9; --muted: #9a9aa2; --line: #3a3a40;
    --pane: #242428; --node: #2b2b30; --node-border: #8a8a90; --accent: #60a5fa;
    --edge: #9a9aa2; --cross: #ff6b6b; --ghost: #55555c; --hl: #6b5b1a;
    --cloud: #263040; --logic: #3a3428;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
  font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(220px, 22%) 1fr;
  height: 100%; }
header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--pane); }
header .title { font-weight: 600; }
#crumbs a, #crumbs span { white-space: nowrap; }
#crumbs .sep { color: var(--muted); margin: 0 4px; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
label { white-space: nowrap; cursor: pointer; }
button, select { font: inherit; cursor: pointer; }
#legend { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px;
  vertical-align: -1px; }
#tree { overflow: auto; padding: 6px 4px 20px 6px; border-right: 1px solid var(--line);
  background: var(--pane); }
#tree ul { list-style: none; margin: 0; padding-left: 14px; }
#tree > ul { padding-left: 0; }
#tree li { white-space: nowrap; }
#tree.hide-wiring li.wiring { display: none; }
#tree .tw { display: inline-block; width: 12px; color: var(--muted); cursor: pointer; }
#tree .item { cursor: pointer; padding: 0 2px; border-radius: 3px; }
#tree .item:hover { background: var(--hl); }
#tree .item.sel { outline: 1px solid var(--accent); }
#tree .dim { color: var(--muted); }
#tree .badge, .badge { color: var(--muted); font-size: 11px; margin-left: 4px; }
#tree input { margin: 0 3px 0 0; vertical-align: -2px; }
#main { position: relative; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; cursor: grab; }
#svg text { fill: var(--fg); font-size: 12px; }
#svg .n rect { fill: var(--node); stroke: var(--node-border); }
#svg .n.port rect { rx: 10; }
#svg .n.ghost rect { stroke-dasharray: 4 3; stroke: var(--ghost); }
#svg .n.ghost text { fill: var(--muted); }
#svg .n.cloud path { fill: var(--cloud); stroke: var(--node-border); }
#svg .n.logic rect { fill: var(--logic); stroke-dasharray: 6 3; }
#svg .n.hl rect, #svg .n.hl path { fill: var(--hl); }
#svg .n.click { cursor: pointer; }
#svg .n.click:hover rect { stroke: var(--accent); stroke-width: 2; }
#svg .n .sub { fill: var(--muted); font-size: 11px; }
#svg .e { fill: none; stroke: var(--edge); stroke-width: 1.3; }
#svg .e.fb { stroke-dasharray: 5 4; }
#svg .e.cross { stroke: var(--cross); }
#svg .e.async { stroke-dasharray: 2 3; }
#svg .el { fill: var(--muted); font-size: 10px; }
#svg .note { fill: var(--muted); font-size: 12px; }
#tip { position: fixed; pointer-events: none; display: none; max-width: 560px; z-index: 7;
  background: var(--pane); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
  white-space: pre-wrap; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#results { position: fixed; z-index: 4; max-height: 60vh; overflow: auto; display: none;
  background: var(--pane); border: 1px solid var(--line); border-radius: 4px; padding: 4px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); }
#results div { padding: 1px 10px; white-space: nowrap; cursor: pointer; }
#results div:hover { background: var(--hl); }
.panel { position: fixed; z-index: 6; display: none; max-height: 80vh; overflow: auto;
  background: var(--pane); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.panel td { padding: 2px 6px 2px 0; white-space: nowrap; }
.panel .note { color: var(--muted); font-size: 11px; max-width: 520px; white-space: normal; }
#hidden-list div { padding: 1px 0; white-space: nowrap; }
#ctx { padding: 4px 0; min-width: 170px; }
#ctx div { padding: 3px 12px; cursor: pointer; white-space: nowrap; }
#ctx div:hover { background: var(--hl); }
#ctx div.head, #ctx div.head:hover { color: var(--muted); cursor: default; background: none; font-size: 11px; }
#mm { position: fixed; inset: 10% 15%; z-index: 6; display: none; flex-direction: column; gap: 6px;
  background: var(--pane); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
#mm textarea { flex: 1; font: 12px ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); }
#svg .axis { stroke: var(--line); }
#info { position: absolute; left: 10px; bottom: 8px; color: var(--muted); pointer-events: none; }
#banner { position: absolute; left: 10px; top: 8px; display: none; padding: 2px 8px;
  background: var(--pane); border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
@media (max-width: 700px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 35% 1fr; }
  header { grid-column: 1; }
  #tree { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title" id="title">Design diagram</span>
    <span id="crumbs"></span>
    <button id="filters-btn" type="button" title="what the views leave out, and how">filters ▾</button>
    <button id="hidden-btn" type="button" title="nodes you hid (right-click a node to hide it)"></button>
    <label title="x: start time and delay in ns, height: bus width (functions with measured delays)"><input type="checkbox" id="f-scale"> hardware scale</label>
    <button id="fit" type="button">fit</button>
    <button id="mermaid" type="button" title="copy the current view as Mermaid flowchart text">copy as Mermaid</button>
    <input id="search" type="search" placeholder="find instance…" size="16">
    <a id="src" title="open the definition in VS Code"></a>
    <span id="legend"></span>
  </header>
  <nav id="tree"></nav>
  <div id="main">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"></g></svg>
    <div id="banner"></div>
    <div id="info"></div>
  </div>
</div>
<div id="tip"></div>
<div id="results"></div>
<div id="filters" class="panel"></div>
<div id="hidden-list" class="panel"></div>
<div id="ctx" class="panel"></div>
<div id="mm"><div>Mermaid text of this view (the clipboard was not available):</div>
  <textarea id="mm-text" readonly></textarea><button id="mm-close" type="button">close</button></div>
<script type="application/json" id="design">__DIAGRAM_DESIGN_JSON__</script>
<script>
"use strict";
// Any uncaught error is recorded where the render test (#selftest) reads it
addEventListener("error", (ev) => document.body.setAttribute("data-error", ev.message + " (line " + ev.lineno + ")"));
const D = JSON.parse(document.getElementById("design").textContent);
const MARK = "____";                       // LOGIC.SUBMODULE_MARKER
const SVGNS = "http://www.w3.org/2000/svg";
const PALETTE = ["#1f77b4", "#2ca02c", "#9467bd", "#ff7f0e", "#8c564b", "#e377c2",
                 "#17becf", "#bcbd22", "#7f7f7f", "#aec7e8"];
const SEP = "\u0001";                      // between the parts of a hidden node's key
const $ = (id) => document.getElementById(id);
// hidden: key -> "pass" | "drop" of the nodes the viewer hid by hand; last: the
// drawn view ({nodes, edges}); size: its extent
const state = { hidden: new Map(), view: null, last: null, size: null };

// ---------- types ----------
const NO_TYPE = { c: "", bits: null };
function T(i) { return i == null ? NO_TYPE : D.types[i] || NO_TYPE; }
function bitsOf(i) { return T(i).bits; }
function roleOf(i) { return T(i).role || "plain"; }
const ROLE_TEXT = { fwd: "forward (stream, fwd_t)", fb: "feedback (fb_t)", plain: "plain" };
// "readable_t (8b)", cut to fit a label
function typeShort(i) {
  const t = T(i);
  if (!t.c) return "";
  const name = t.name || t.c;
  return (name.length > 30 ? name.slice(0, 29) + "…" : name) + (t.bits != null ? " (" + t.bits + "b)" : "");
}
function typeLong(i) {
  const t = T(i);
  if (!t.c) return "";
  return (t.name ? t.name + " = " + t.c : t.c) + (t.bits != null ? ", " + t.bits + " bits" : "") +
    (t.role ? ", " + ROLE_TEXT[t.role] : "");
}

// ---------- filters ----------
// What a view can leave out, per kind of node or edge: show it, group it (operators
// only: each connected cluster becomes one logic block), hide it with its edges
// passing through ("pass"), or hide it with its edges ("drop"). A typed kind's mode
// applies to the interface roles its scope names, the rest are shown.
const KINDS = [
  { id: "in", label: "inputs", tip: "function inputs and top-level Input pins", modes: ["show", "drop"], typed: true, def: "show" },
  { id: "out", label: "outputs", tip: "function outputs and top-level Output pins", modes: ["show", "drop"], typed: true, def: "show" },
  { id: "reg", label: "registers", tip: "a Reg's current and next value; passing through joins them as one edge", modes: ["show", "pass", "drop"], typed: true, def: "show" },
  { id: "wire", label: "global wire reads and writes", tip: "a function's global wire read and write stubs", modes: ["show", "drop"], typed: true, def: "show" },
  { id: "fb", label: "Feedback edges", tip: "edges through a Feedback variable, by the type the variable carries", modes: ["show", "drop"], typed: true, def: "drop", scope: "fb" },
  { id: "wiring", label: "wiring", tip: "@wires functions, MAINs, functions and operators with no logic (casts, constant field selects)", modes: ["show", "pass", "drop"], def: "pass" },
  { id: "op", label: "operators", tip: "operators and other built-ins", modes: ["show", "group", "pass", "drop"], def: "group" },
  { id: "const", label: "constants, clock enable", modes: ["show", "drop"], def: "drop" },
  { id: "ghost", label: "other files' MAINs", tip: "in a file's view, the MAINs of other files it connects to", modes: ["show", "drop"], def: "show" },
];
const KIND = new Map(KINDS.map((k) => [k.id, k]));
const SCOPES = [
  ["all", "of every type", ["fwd", "fb", "plain"]],
  ["nonfwd", "except forward (streams, fwd_t)", ["fb", "plain"]],
  ["fwd", "forward only (streams, fwd_t)", ["fwd"]],
  ["fb", "feedback only (fb_t)", ["fb"]],
  ["plain", "plain only (no interface)", ["plain"]],
];
const SCOPE = new Map(SCOPES.map(([id, , roles]) => [id, roles]));
const MODE_TEXT = { show: "show", group: "group into logic blocks", pass: "hide, edges pass through", drop: "hide with edges" };
const LABELS = [["both", "name: type"], ["name", "name"], ["type", "type"], ["none", "none"]];
function defaults() {
  const f = { labels: "both" };
  for (const k of KINDS) f[k.id] = { mode: k.def, scope: k.scope || "all" };
  return f;
}
let filt = defaults();
// Per-viewer conveniences in the browser's storage; a page without it uses the defaults
const STORE = "pypelinec-diagram:";
let storageOff = false;   // the self-test leaves the browser's storage alone
function loadStored(key) {
  try { const v = localStorage.getItem(STORE + key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
}
function store(key, value) {
  if (storageOff) return;
  try { localStorage.setItem(STORE + key, JSON.stringify(value)); } catch (e) { /* storage blocked */ }
}
function loadSettings() {
  const f = defaults(), saved = loadStored("filters");
  if (saved && typeof saved === "object") {
    for (const k of KINDS) {
      const s = saved[k.id];
      if (!s) continue;
      if (k.modes.includes(s.mode)) f[k.id].mode = s.mode;
      if (k.typed && SCOPE.has(s.scope)) f[k.id].scope = s.scope;
    }
    if (LABELS.some(([id]) => id === saved.labels)) f.labels = saved.labels;
  }
  filt = f;
  const hid = loadStored("hidden:" + D.build.top);
  state.hidden = new Map(Array.isArray(hid) ? hid.filter((h) => Array.isArray(h) && (h[1] === "pass" || h[1] === "drop")) : []);
}
function saveSettings() { store("filters", filt); store("hidden:" + D.build.top, [...state.hidden]); }
// Whether kind k's mode applies to something with this interface role
function applies(k, role) { return !KIND.get(k).typed || SCOPE.get(filt[k].scope).includes(role || "plain"); }

// ---------- names and lookups ----------
const clockIds = Object.keys(D.clocks).sort();
function clockColor(cid) {
  const i = clockIds.indexOf(cid);
  return i < 0 ? "#999" : PALETTE[i % PALETTE.length];
}
function base(path) { return path ? path.split("/").pop() : "?"; }
function loc(file, line) { return file ? base(file) + (line ? ":" + line : "") : ""; }
function func(name) { return D.funcs[name] || { kind: "op" }; }
function mainLabel(m) {
  const e = D.mains[m], f = D.funcs[m];
  if (e && e.name) return e.name;
  return (f && f.def) || m;
}
function mainGroup(m) {
  const e = D.mains[m];
  return e && e.group ? "group:" + e.group : m;
}
function mainOf(inst) { return inst.startsWith("pin:") ? inst : inst.split(MARK)[0]; }
function fmtNs(x) { return x == null ? "" : (Math.round(x * 100) / 100) + " ns"; }
function hasGraph(fname) { const f = D.funcs[fname]; return !!(f && f.graph); }
const topFile = Object.keys(D.files).find((p) => D.files[p].top) || null;
// A function's graph as {nodes: {id: node}, edges: [{s, sp, d, dp, t, names, fb}]},
// unpacked once from the page's compact form (edges name nodes by index)
const graphs = new Map();
function graphOf(fname) {
  if (graphs.has(fname)) return graphs.get(fname);
  const f = D.funcs[fname];
  let g = null;
  if (f && f.graph) {
    const list = f.graph.nodes, nodes = {};
    for (const n of list) nodes[n.id] = n;
    const edges = f.graph.edges.map(([s, sp, d, dp, t, names, fb]) =>
      ({ s: list[s].id, sp, d: list[d].id, dp, t, names, fb: !!fb }));
    g = { nodes, edges };
  }
  graphs.set(fname, g);
  return g;
}
// An operator's name from its function (BIN_OP_PLUS_uint8_t_uint8_t -> BIN_OP_PLUS)
// and the symbol a logic block shows for it
function opName(callee) {
  const out = [];
  for (const t of callee.split("_")) { if (/^[A-Z0-9]+$/.test(t)) out.push(t); else break; }
  return out.length ? out.join("_") : callee;
}
const OP_SYMBOLS = { BIN_OP_PLUS: "+", BIN_OP_MINUS: "−", BIN_OP_MULT: "×", BIN_OP_INFERRED_MULT: "×",
  BIN_OP_DIV: "÷", BIN_OP_MOD: "%", BIN_OP_EQ: "==", BIN_OP_NEQ: "!=", BIN_OP_LT: "<", BIN_OP_LTE: "<=",
  BIN_OP_GT: ">", BIN_OP_GTE: ">=", BIN_OP_AND: "&", BIN_OP_OR: "|", BIN_OP_XOR: "^", BIN_OP_SL: "<<",
  BIN_OP_SR: ">>", UNARY_OP_NOT: "~", UNARY_OP_NEGATE: "−x", MUX: "mux", VAR_REF_RD: "[i]",
  VAR_REF_ASSIGN: "[i]=" };
function opSymbol(name) { return OP_SYMBOLS[name] || name.toLowerCase(); }

// Resolve an instance path (MAIN____local____local) to [[inst, func, local], ...]
function resolve(inst) {
  const toks = inst.split(MARK);
  const main = toks[0];
  if (!D.funcs[main]) return null;
  const chain = [[main, main, null]];
  let cur = main, path = main, i = 1;
  while (i < toks.length) {
    const g = graphOf(cur);
    if (!g) return null;
    let j = i, local = null;
    for (; j < toks.length; j++) {     // a local name may itself hold the marker
      const cand = toks.slice(i, j + 1).join(MARK);
      if (g.nodes["s:" + cand]) { local = cand; break; }
    }
    if (local == null) return null;
    cur = g.nodes["s:" + local].callee;
    path += MARK + local;
    chain.push([path, cur, local]);
    i = j + 1;
  }
  return chain;
}
function instLatency(inst) {
  if (!inst.includes(MARK) && D.mains[inst]) return D.mains[inst].latency;
  return D.inst_latency[inst] || 0;
}

// ---------- files ----------
const fileOrder = [];      // [path, parent or null] in tree order
(function orderFiles() {
  const seen = new Set();
  const queue = topFile ? [[topFile, null]] : [];
  while (queue.length) {
    const [p, parent] = queue.shift();
    if (seen.has(p) || !D.files[p]) continue;
    seen.add(p);
    fileOrder.push([p, parent]);
    for (const q of D.files[p].imports) queue.push([q, p]);
  }
  for (const p of Object.keys(D.files).sort()) if (!seen.has(p)) fileOrder.push([p, null]);
})();
// The view a file's link shows: the top file is the whole design
function fileRoute(p) { return D.files[p] && D.files[p].top ? { design: 1 } : { file: p }; }

// ---------- tooltip ----------
const tip = $("tip");
function showTip(ev, text) {
  tip.textContent = text;
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 4) x = Math.max(4, ev.clientX - w - 14);
  if (y + h > innerHeight - 4) y = Math.max(4, ev.clientY - h - 14);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function attachTip(el, textFn) {
  el.addEventListener("mousemove", (ev) => showTip(ev, textFn()));
  el.addEventListener("mouseleave", hideTip);
}
function funcTip(fname, extra) {
  const f = func(fname), lines = [];
  if (extra) lines.push(...extra);
  lines.push("function: " + fname);
  if (f.def && f.def !== fname) lines.push("def: " + f.def);
  lines.push("kind: " + f.kind + (f.file ? "   " + loc(f.file, f.line) : ""));
  if (f.wiring) lines.push("only wiring: " + f.wiring);
  if (f.delay_ns != null) lines.push("delay: " + fmtNs(f.delay_ns) + (f.delay_estimated ? " (estimated)" : ""));
  if (f.mcp) lines.push("multi-cycle paths");
  const ports = (list) => list.map(([p, t]) => p + (T(t).c ? ": " + typeShort(t) : "")).join(", ");
  if (f.inputs && f.inputs.length) lines.push("in:  " + ports(f.inputs));
  if (f.outputs && f.outputs.length) lines.push("out: " + ports(f.outputs));
  if (f.regs) lines.push("regs: " + f.regs.join(", "));
  return lines.join("\n");
}

// ---------- tree pane ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function treeItem(label, opts) {
  const li = el("li", opts.cls || null);
  const tw = el("span", "tw", opts.children ? "▸" : "");
  li.appendChild(tw);
  if (opts.check) li.appendChild(opts.check);
  if (opts.color) { const s = el("span", "sw"); s.style.background = opts.color; li.appendChild(s); }
  const it = el("span", "item" + (opts.dim ? " dim" : ""), label);
  if (opts.route) it.dataset.route = opts.route;
  li.appendChild(it);
  if (opts.badge) li.appendChild(el("span", "badge", opts.badge));
  if (opts.tip) attachTip(it, opts.tip);
  if (opts.onclick) it.addEventListener("click", opts.onclick);
  let ul = null;
  const toggle = () => {
    if (!opts.children) return;
    if (!ul) { ul = el("ul"); opts.children(ul); li.appendChild(ul); tw.textContent = "▾"; return; }
    const open = ul.style.display !== "none";
    ul.style.display = open ? "none" : "";
    tw.textContent = open ? "▸" : "▾";
  };
  tw.addEventListener("click", toggle);
  if (opts.open) toggle();
  return li;
}
function latBadge(n) { return n ? "L=" + n : ""; }
function instChildren(inst, fname) {
  return (ul) => {
    const g = graphOf(fname);
    if (!g) return;
    for (const id of Object.keys(g.nodes).sort()) {
      const n = g.nodes[id];
      if (n.kind !== "sub") continue;
      const cf = func(n.callee);
      if (cf.kind === "op") continue;
      const child = inst + MARK + id.slice(2);
      const lat = instLatency(child);
      ul.appendChild(treeItem(n.name, {
        cls: cf.wiring ? "wiring" : null,
        badge: [cf.def && !cf.def.startsWith(n.name) ? cf.def : "", latBadge(lat), n.auto_fsm ? "AUTO_FSM" : "",
                cf.kind === "vhdl" ? "vhdl" : "", cf.wiring ? "wiring" : ""].filter(Boolean).join(" "),
        route: "inst=" + (hasGraph(n.callee) ? child : inst),
        onclick: () => go(hasGraph(n.callee) ? { inst: child } : { inst: inst, hl: id }),
        children: hasGraph(n.callee) ? instChildren(child, n.callee) : null,
        tip: () => funcTip(n.callee, ["instance: " + child, "latency: " + lat]),
      }));
    }
  };
}
function buildTree() {
  const root = el("ul");
  root.appendChild(treeItem("⌂ whole design", {
    route: "design", onclick: () => go({ design: 1 }),
    tip: () => "every MAIN, joined by its global wires",
  }));
  const libs = [], byParent = new Map();
  for (const [p, parent] of fileOrder) {
    const f = D.files[p];
    if (f.kind === "generated" && !f.mains.length) continue;
    if (f.kind === "library") { if (!f.mains.length) { libs.push(p); continue; } }

    if (r.inst) functionView(r.inst, r.hl);
    else designView(r.file || null);
    $("info").textContent = "";
  } catch (err) {
    vp.replaceChildren();
    $("info").textContent = "cannot draw this view: " + err.message;
  }
}

// ---------- panels: filters, hidden nodes, a node's menu ----------
function closePanels() { for (const id of ["filters", "hidden-list", "ctx"]) $(id).style.display = "none"; }
function placePanel(box, x, y) {
  box.style.display = "block";
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(4, Math.min(x, innerWidth - w - 4)) + "px";
  box.style.top = Math.max(4, Math.min(y, innerHeight - h - 4)) + "px";
}
function placeBelow(box, anchor) { const r = anchor.getBoundingClientRect(); placePanel(box, r.left, r.bottom + 4); }
function filtersChanged() { saveSettings(); treeFilterClass(); render(); }
function buildFilters() {
  const box = $("filters");
  box.replaceChildren();
  const table = el("table");
  const select = (options, value, onchange) => {
    const s = el("select");
    for (const [v, text] of options) { const o = el("option", null, text); o.value = v; s.appendChild(o); }
    s.value = value;
    s.addEventListener("change", () => onchange(s.value));
    const td = el("td"); td.appendChild(s);
    return td;
  };
  for (const k of KINDS) {
    const tr = el("tr");
    const name = el("td", null, k.label);
    if (k.tip) name.title = k.tip;
    tr.appendChild(name);
    const modes = k.modes.map((m) => [m, k.modes.length === 2 && m === "drop" ? "hide" : MODE_TEXT[m]]);
    tr.appendChild(select(modes, filt[k.id].mode, (v) => { filt[k.id].mode = v; filtersChanged(); }));
    if (k.typed) tr.appendChild(select(SCOPES.map(([id, text]) => [id, text]), filt[k.id].scope, (v) => { filt[k.id].scope = v; filtersChanged(); }));
    table.appendChild(tr);
  }
  const tr = el("tr");
  tr.appendChild(el("td", null, "edge labels"));
  tr.appendChild(select(LABELS, filt.labels, (v) => { filt.labels = v; filtersChanged(); }));
  table.appendChild(tr);
  box.appendChild(table);
  box.appendChild(el("div", "note", "Hidden things either pass their edges through or take them along; " +
    "a typed kind's mode applies to the interface roles its second choice names (forward: streams " +
    "{data, valid} and fwd_t; feedback: fb_t), the rest are shown. Right-click a node to hide just it."));
  const reset = el("button", null, "defaults");
  reset.type = "button";
  reset.addEventListener("click", () => { filt = defaults(); buildFilters(); filtersChanged(); });
  box.appendChild(reset);
}
$("filters-btn").addEventListener("click", (ev) => {
  const open = $("filters").style.display === "block";
  closePanels();
  if (!open) placeBelow($("filters"), ev.currentTarget);
});
// The header button lists what was hidden by hand
function hiddenButton() {
  const b = $("hidden-btn");
  b.textContent = state.hidden.size + " hidden";
  b.style.display = state.hidden.size ? "" : "none";
}
function setHidden(keys, mode) {   // mode null shows them again
  for (const k of keys) { if (mode) state.hidden.set(k, mode); else state.hidden.delete(k); }
  saveSettings();
  hiddenButton();
  document.querySelectorAll("#tree input[data-key]").forEach((cb) => { cb.checked = !state.hidden.has(cb.dataset.key); });
  render();
}
function hiddenLabel(key) {
  const i = key.indexOf(SEP), a = key.slice(0, i), b = key.slice(i + 1);
  if (a === "main") return "MAIN " + mainLabel(b);
  if (a === "pin") return "pin " + ((D.pins[b] || {}).name || b);
  const g = graphOf(a), n = g && g.nodes[b];
  const what = n ? (n.kind === "sub" ? n.name : n.kind + " " + n.name) : b;
  return what + " in " + ((D.funcs[a] || {}).def || a);
}
function showHiddenList() {
  const box = $("hidden-list");
  box.replaceChildren();
  const keys = [...state.hidden.keys()].sort();
  for (const k of keys) {
    const row = el("div");
    row.appendChild(document.createTextNode(hiddenLabel(k) + (state.hidden.get(k) === "pass" ? " (edges pass through) " : " (with edges) ")));
    const a = el("a", null, "show");
    a.addEventListener("click", () => { setHidden([k], null); if (state.hidden.size) showHiddenList(); else closePanels(); });
    row.appendChild(a);
    box.appendChild(row);
  }
  const all = el("button", null, "show all");
  all.type = "button";
  all.addEventListener("click", () => { closePanels(); setHidden(keys, null); });
  box.appendChild(all);
  placeBelow(box, $("hidden-btn"));
}
$("hidden-btn").addEventListener("click", () => {
  const open = $("hidden-list").style.display === "block";
  closePanels();
  if (!open) showHiddenList();
});
function openMenu(ev, hide) {
  closePanels();
  const box = $("ctx");
  box.replaceChildren(el("div", "head", hide.label));
  for (const m of hide.modes) {
    const item = el("div", null, hide.modes.length === 1 ? "hide" : MODE_TEXT[m]);
    item.addEventListener("click", () => { closePanels(); setHidden(hide.keys, m); });
    box.appendChild(item);
  }
  placePanel(box, ev.clientX, ev.clientY);
}
addEventListener("keydown", (ev) => { if (ev.key === "Escape") closePanels(); });

// ---------- search ----------
let instIndex = null;   // [display path, instance, parent instance, node id] of non-operator instances
function buildIndex() {
  instIndex = [];
  const walk = (inst, fname, label, depth) => {
    const g = graphOf(fname);
    if (!g || depth > 64 || instIndex.length > 50000) return;
    for (const id of Object.keys(g.nodes).sort()) {
      const n = g.nodes[id];
      if (n.kind !== "sub" || func(n.callee).kind === "op") continue;
      const child = inst + MARK + id.slice(2), text = label + "/" + n.name;
      instIndex.push([text, child, inst, id]);
      walk(child, n.callee, text, depth + 1);
    }
  };
  for (const m of Object.keys(D.mains).sort()) { instIndex.push([mainLabel(m), m, null, null]); walk(m, m, mainLabel(m), 0); }
}
function search(text) {
  const box = $("results");
  box.replaceChildren();
  text = text.trim().toLowerCase();
  if (!text) { box.style.display = "none"; return; }
  if (!instIndex) buildIndex();
  const hits = instIndex.filter((r) => r[0].toLowerCase().includes(text)).slice(0, 200);
  for (const [label, child, parent, id] of hits) {
    const d = el("div", null, label);
    d.addEventListener("click", () => {
      box.style.display = "none";
      go(parent == null || hasGraph(resolve(child).pop()[1]) ? { inst: child } : { inst: parent, hl: id });
    });
    box.appendChild(d);
  }
  if (!hits.length) box.appendChild(el("div", "dim", "no instance matches"));
  const r = $("search").getBoundingClientRect();
  box.style.left = Math.max(4, Math.min(r.left, innerWidth - 420)) + "px";
  box.style.top = r.bottom + 4 + "px";
  box.style.display = "block";
}
$("search").addEventListener("input", (ev) => search(ev.target.value));
addEventListener("click", (ev) => {
  if (!$("results").contains(ev.target) && ev.target !== $("search")) $("results").style.display = "none";
  for (const [panel, button] of [["filters", "filters-btn"], ["hidden-list", "hidden-btn"], ["ctx", null]]) {
    if (!$(panel).contains(ev.target) && (!button || !$(button).contains(ev.target))) $(panel).style.display = "none";
  }
});

// ---------- copy as Mermaid ----------
function mermaidText() {
  const { nodes, edges } = state.last || { nodes: [], edges: [] };
  const q = (t) => '"' + String(t).replace(/"/g, "#quot;") + '"';
  const ids = new Map(nodes.map((n, i) => [n.id, "n" + i]));
  const lines = ["flowchart LR"];
  for (const n of nodes) lines.push("    " + ids.get(n.id) + (isCloud(n) ? "((" + q(n.lines.join("<br>")) + "))" : "[" + q(n.lines.join("<br>")) + "]"));
  for (const e of edges) {
    if (!ids.has(e.s) || !ids.has(e.d)) continue;
    const arrow = e.fb ? "-.->" : "-->";
    lines.push("    " + ids.get(e.s) + " " + arrow + (e.text ? "|" + q(e.text) + "|" : "") + " " + ids.get(e.d));
  }
  return lines.join("\n") + "\n";
}
$("mermaid").addEventListener("click", () => {
  const text = mermaidText();
  const fallback = () => { $("mm-text").value = text; $("mm").style.display = "flex"; $("mm-text").select(); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => { $("info").textContent = "copied Mermaid text"; }, fallback);
  } else fallback();
});
$("mm-close").addEventListener("click", () => { $("mm").style.display = "none"; });

// ---------- self-test ----------
// Draws every view with the default filters, everything shown and everything
// hidden, checking what each must and must not draw, then marks <body>
// data-ready="<views drawn>" (data-error on any failure), which the render test reads
function withFilters(change, fn) {
  const saved = JSON.stringify(filt);
  change(filt);
  try { return fn(); } finally { filt = JSON.parse(saved); }
}
const ALL_SHOWN = (f) => { for (const k of KINDS) f[k.id].mode = "show"; };
const ALL_HIDDEN = (f) => {
  for (const k of KINDS) { f[k.id].mode = k.modes.includes("pass") ? "pass" : "drop"; f[k.id].scope = "all"; }
};
function selftest() {
  let views = 0;
  const check = (ok, what) => { if (!ok) throw new Error("self-test: " + what); };
  const drawnIds = (v) => new Set(v.nodes.map((n) => n.id));
  // What a graph node is, from the data alone (not from the filters' own nodeKindOf)
  const isOp = (gn) => gn.kind === "sub" && func(gn.callee).kind === "op" && !func(gn.callee).wiring;
  const isWiring = (gn) => gn.kind === "sub" && !!func(gn.callee).wiring;
  const isBlock = (gn) => gn.kind === "sub" && !isOp(gn) && !isWiring(gn);
  try {
    storageOff = true;
    filt = defaults();
    state.hidden = new Map();
    const home = designView(null); views++;
    check($("banner").style.display === "none", "the whole design has a file banner");
    for (const n of home.nodes) {
      if (n.id.startsWith("pin:")) continue;
      const ms = Object.keys(D.mains).filter((m) => mainGroup(m) === n.id);
      check(!ms.every((m) => D.mains[m].wiring), "wiring MAIN drawn by default: " + n.id);
    }
    if (topFile) check(fileRoute(topFile).design, "the top file does not open the whole design");
    for (const p of Object.keys(D.files)) {
      designView(p); views++;
      check($("banner").style.display === "block", "a file view has no banner: " + p);
    }
    const done = new Set();
    const walk = (inst, fname) => {
      if (done.has(fname)) return;
      done.add(fname);
      const g = graphOf(fname);
      const v = functionView(inst); views++;
      const ids = drawnIds(v);
      for (const e of v.edges) check(ids.has(e.s) && ids.has(e.d), "edge to an undrawn node in " + fname);
      for (const n of v.nodes) {
        const gn = g.nodes[n.id];
        if (!gn) continue;
        check(!isOp(gn), "a default view draws an operator " + n.id + " in " + fname);
        check(!isWiring(gn), "a default view draws a wiring call site " + n.id + " in " + fname);
        check(gn.kind !== "const" && gn.kind !== "ce", "a default view draws a constant " + n.id + " in " + fname);
      }
      for (const e of v.edges) check(!e.feedbackRoles.includes("fb"), "a default view draws an fb_t Feedback edge in " + fname);
      // Operators joined by a surviving edge share one logic block
      const gid = new Map();
      for (const [id, grp] of v.groups) for (const m of grp.members) gid.set(m, id);
      for (const e of g.edges) {
        if (e.fb && roleOf(e.t) === "fb") continue;
        if (gid.has(e.s) && gid.has(e.d)) check(gid.get(e.s) === gid.get(e.d), "joined operators in two logic blocks in " + fname);
      }
      withFilters(ALL_SHOWN, () => {
        const w = functionView(inst); views++;
        const shown = drawnIds(w);
        for (const id of Object.keys(g.nodes)) check(shown.has(id), "not every node drawn with everything shown: " + id + " in " + fname);
      });
      withFilters(ALL_HIDDEN, () => {
        const w = functionView(inst); views++;
        for (const n of w.nodes) {
          const gn = g.nodes[n.id];
          check(gn && isBlock(gn), "drawn with everything hidden: " + n.id + " in " + fname);
        }
        for (const e of w.edges) check(!e.feedbackRoles.length, "Feedback edge drawn with everything hidden in " + fname);
      });
      if (func(fname).offsets) { $("f-scale").checked = true; functionView(inst); $("f-scale").checked = false; views++; }
      for (const id of Object.keys(g.nodes)) {
        const n = g.nodes[id];
        if (n.kind === "sub" && func(n.callee).kind !== "op" && hasGraph(n.callee)) walk(inst + MARK + id.slice(2), n.callee);
      }
    };
    for (const m of Object.keys(D.mains).sort()) if (hasGraph(m)) walk(m, m);
    // Hiding one node by hand as its menu does (render() draws the design view
    // at #selftest), with its edges passing through and with them
    const rendered = () => check(!$("info").textContent, "render: " + $("info").textContent);
    const first = home.nodes.find((n) => n.hide && n.hide.modes.includes("pass"));
    if (first) {
      openMenu({ clientX: 10, clientY: 10 }, first.hide);
      for (const m of ["pass", "drop"]) {
        setHidden(first.hide.keys, m); views++; rendered();
        check(!drawnIds(state.last).has(first.id), "a MAIN hidden by hand is drawn (" + m + ")");
        showHiddenList();
        setHidden(first.hide.keys, null); views++; rendered();
        check(drawnIds(state.last).has(first.id), "a MAIN shown again is not drawn (" + m + ")");
      }
    }
    // A filter changed as the panel does
    buildFilters();
    filt.ghost.mode = "drop";
    filtersChanged(); views++; rendered();
    filt = defaults();
    closePanels();
    if (!mermaidText().startsWith("flowchart LR")) throw new Error("mermaid text");
    buildIndex(); search("a"); search("");
    document.body.setAttribute("data-ready", String(views));
  } catch (err) {
    document.body.setAttribute("data-error", String(err && err.stack || err));
  }
}

// ---------- start ----------
function legend() {
  const lg = $("legend");
  for (const cid of clockIds) {
    const c = D.clocks[cid], s = el("span");
    const sw = el("span", "sw"); sw.style.background = clockColor(cid);
    s.appendChild(sw);
    s.appendChild(document.createTextNode(cid + (c.name ? " (" + c.name + ")" : "")));
    lg.appendChild(s);
  }
}
$("title").textContent = base(D.build.top) + " — design diagram";
document.title = base(D.build.top) + " diagram";
if (location.hash !== "#selftest") loadSettings();
legend();
buildFilters();
hiddenButton();
$("f-scale").addEventListener("change", render);
buildTree();
if (location.hash === "#selftest") selftest();
else { addEventListener("hashchange", render); render(); }
</script>
