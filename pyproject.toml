[tool.poetry]
name = "pypelinec"
version = "0.0.0"
description = "A hardware description language (HDL) adding high level synthesis(HLS)-like automatic pipelining as a language construct/compiler feature."
authors = ["Julian Kemmerer <julian.v.kemmerer@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
pyrtl = "^0.11.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
format-jinja = "0.0.0.dev0+{{ timestamp[:8] }}.g{{commit}}"
